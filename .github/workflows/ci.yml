name: checks

# Runs the structural guard scripts on every push and PR. Until now nothing ran them, and
# they could not pass on a fresh clone (dist/ is gitignored, so the parity checks had nothing
# to diff against). This builds the Codex package first, then runs every guard.
on:
  push:
    branches: ["**"]
  pull_request:

# Read-only by default; only the publish job below gets write access.
permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Codex package (dist/ is gitignored — create it before parity checks)
        run: bash scripts/package-codex-plugin.sh

      - name: Validate JSON configs and manifests parse
        run: |
          set -e
          for f in config/defaults.json .claude-plugin/plugin.json \
                   .claude-plugin/marketplace.json .codex-plugin/plugin.json; do
            echo "== $f =="
            python3 -c "import json,sys; json.load(open('$f'))"
          done

      - name: Run guard scripts
        run: |
          set -e
          shopt -s nullglob
          for g in scripts/checks/*.sh; do
            echo "::group::$g"
            bash "$g"
            echo "::endgroup::"
          done

      # Eval harness (WS-8): a GATE from v2.3. A RED fixture FAILS the build and blocks the
      # release (promoted from non-blocking once the 7 fixtures were stable). Surfaces the
      # structural/wiring regressions the grep-guards above can't see. It covers structure only:
      # whether the 7 semantic behaviors actually FIRE is proven by the LOCAL forward-test runner
      # (scripts/forward-test.sh, fired vs control in fresh sessions) — never run here, since it
      # needs Claude credentials and costs tokens. scripts/checks/forward-test-guard.sh (above)
      # pins that runner's case structure.
      - name: Run eval harness (blocking)
        run: bash scripts/eval.sh


  # Publish the runtime-only Claude plugin tree to the `dist` branch — what users install from
  # (`claude plugin marketplace add rohitsharma9646/feature-flow#dist`). Only on pushes to master,
  # only after every guard passed; commits only when the runtime tree actually changed.
  publish-dist:
    needs: guards
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish runtime-only tree to the dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-claude-dist.sh

