name: integrity

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-latest}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: macos-x86_64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-latest}
          - {target: windows-x86_64, runner: windows-latest}
          - {target: windows-arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Unit and conformance tests
        shell: bash
        run: go test ./...
      - name: Assemble target packages
        shell: bash
        run: bash scripts/build-integrity-packages.sh "${{ matrix.target }}"
      - name: Native packaged smoke
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) exe="dist/integrity/${{ matrix.target }}/claude/bin/ff-integrity-classify.exe" ;;
            *) exe="dist/integrity/${{ matrix.target }}/claude/bin/ff-integrity-classify"; chmod +x "$exe" ;;
          esac
          "$exe" < integrity/testdata/manifests/current-feature.json > source.out
          codex_exe="${exe/\\/claude\\//\\/codex\\/}"
          "$codex_exe" < integrity/testdata/manifests/current-feature.json > codex.out
          cmp source.out codex.out
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-${{ matrix.target }}
          path: dist/integrity/${{ matrix.target }}
