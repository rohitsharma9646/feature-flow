name: integrity

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        shell: bash
        run: |
          matrix="$(jq -c '{include: [.targets[] | select(.state == "supported") | {target: .id, runner: .runner}]}' release/targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-package:
    needs: inventory
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Unit and conformance tests
        shell: bash
        run: go test ./...
      - name: Assemble target packages
        shell: bash
        run: bash scripts/build-integrity-packages.sh "${{ matrix.target }}"
      - name: Native full source/package conformance
        shell: bash
        run: bash scripts/check-integrity-package-conformance.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-${{ matrix.target }}
          path: dist/integrity/${{ matrix.target }}
